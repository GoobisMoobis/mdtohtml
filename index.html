<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown to HTML Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js"></script>
    
    <!-- CodeMirror CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css"
    />
    <style>
        body {
          font-family: Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          min-height: 100vh;
          margin: 0;
          background-color: #f0f0f0;
          padding: 1%;
        }
        
        .container {
          display: flex;
          flex-direction: column;
          width: 100%;
          max-width: 98%;
          height: 95vh;
          gap: 1%;
        }
        
        .main-container {
          display: flex;
          height: 90%;
          width: 100%;
          overflow: hidden;
          position: relative;
        }
        
        .mobile-toggle {
          display: none;
        }
        
        .editor-preview-container {
          width: 50%;
          min-width: 200px;
          max-width: calc(100% - 200px);
          display: flex;
          flex-direction: column;
          height: 100%;
        }
        
        .editor-container {
          border: 1px solid #ccc;
          border-radius: 0.25em;
          overflow: hidden;
          background-color: #1e1e1e;
          color: #d4d4d4;
          height: 100%;
          position: relative;
        }
        
        .CodeMirror {
          height: 100%;
          font-family: "Consolas", "Monaco", monospace;
          font-size: 14px;
          line-height: 1.5;
        }
        
        .editor-wrapper {
          height: 100%;
          display: none;
        }
        
        .editor-wrapper.active {
          display: block;
        }
        
        .preview-container {
          flex: 1;
          display: flex;
          flex-direction: column;
          height: 100%;
          min-width: 200px;
        }
        
        .preview {
          border: 1px solid #ccc;
          border-radius: 0.25em;
          padding: 20px;
          background-color: white;
          overflow: auto;
          height: 100%;
          box-sizing: border-box;
        }
        
        .toolbar {
          display: flex;
          gap: 10px;
          padding: 10px;
          background-color: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 0.25em;
          margin-bottom: 10px;
        }
        
        button {
          padding: 8px 16px;
          background-color: #4caf50;
          color: white;
          border: none;
          border-radius: 0.25em;
          cursor: pointer;
          font-size: 14px;
        }
        
        button:hover {
          background-color: #45a049;
        }
        
        .resizer {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          background-color: #ccc;
          width: 5px;
          height: 100%;
          cursor: col-resize;
          z-index: 10;
        }
        
        h1 {
          text-align: center;
          color: #333;
          margin-bottom: 10px;
        }
        
        .preview pre {
          background-color: #f6f8fa;
          border-radius: 0.25em;
          padding: 16px;
          overflow: auto;
        }
        
        .preview code {
          font-family: "Consolas", "Monaco", monospace;
          padding: 0.2em 0.4em;
          border-radius: 0.25em;
        }
        
        .preview pre code {
          padding: 0;
        }
        
        .preview blockquote {
          border-left: 4px solid #ddd;
          padding-left: 1em;
          margin-left: 0;
          color: #666;
          background-color: #f9f9f9;
          padding: 10px;
          box-sizing: border-box;
          overflow: hidden;
        }
        
        @media (max-width: 768px) {
          body {
            padding: 5px;
          }
        
          .container {
            height: 100vh;
            max-width: 100%;
          }
        
          .main-container {
            flex-direction: column;
            height: auto;
            gap: 5px;
          }
        
          .editor-preview-container {
            height: 50vh;
            min-height: 300px;
            width: 100% !important;
            max-width: 100%;
          }
        
          .preview-container {
            height: 40vh;
            min-height: 250px;
          }
        
          .resizer {
            display: none !important;
          }
        
          .mobile-toggle {
            display: block;
          }
        
          .mobile-toggle button {
            width: 100%;
            margin-bottom: 5px;
          }
        
          .toolbar {
            flex-wrap: wrap;
            gap: 5px;
          }
        
          .toolbar button {
            flex: 1;
            min-width: 120px;
          }
        
          h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
          }
        
          .preview {
            font-size: 14px;
            padding: 15px;
          }
        }
        
        @media (max-height: 600px) {
          .container {
            height: auto;
            min-height: 95vh;
          }
        
          .main-container {
            height: auto;
            min-height: 80vh;
          }
        
          .editor-preview-container {
            min-height: 250px;
          }
        
          .preview-container {
            min-height: 200px;
          }
        }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Markdown to HTML Editor</h1>

      <div class="toolbar">
        <button id="toggleHtmlBtn">Toggle HTML View</button>
        <button id="openPreviewBtn">Open Preview in New Tab</button>
        <button id="downloadBtn">Download MdToHtml app</button>
        <div class="mobile-toggle">
          <button id="mobileToggleBtn">Switch to Preview</button>
        </div>
      </div>

      <div class="main-container">
        <div class="editor-preview-container">
          <div class="editor-container">
            <div id="markdownEditorWrapper" class="editor-wrapper active"></div>
            <div id="htmlEditorWrapper" class="editor-wrapper"></div>
          </div>
        </div>

        <div class="resizer" id="resizer"></div>

        <div class="preview-container">
          <div class="preview" id="htmlPreview"></div>
        </div>
      </div>
    </div>

    <script>
      let markdownEditor, htmlEditor;
      let isHtmlView = false;
      let isResizing = false;
      let isMobilePreviewMode = false;

      function initializeEditors() {
        markdownEditor = CodeMirror(document.getElementById('markdownEditorWrapper'), {
          mode: 'markdown',
          theme: 'dracula',
          lineNumbers: true,
          lineWrapping: false,
          indentUnit: 4,
          tabSize: 4,
          indentWithTabs: false,
          value: `# Welcome to GoobisMoobis2's MD to HTML converter!

[comment]: <> (write your markdown here!)

MD is a popular markdown format. I personally have used it for GitHub Pages sites.

This is mainly meant as a tool to make site pages faster than typing raw HTML and be able to see them change in real time

## Thanks to:
- [markedjs](https://github.com/markedjs/marked)
- [highlightjs](https://github.com/highlightjs/highlight.js)
- [js-beautify](https://github.com/beautifier/js-beautify)
- [CodeMirror](https://codemirror.net/)

## Want to learn Markdown?
- [Cheat Sheet](https://www.markdownguide.org/cheat-sheet/)
- [Basic Syntax](https://www.markdownguide.org/basic-syntax/)
- [Extended Syntax](https://www.markdownguide.org/extended-syntax/)

**Want to be able to open markdown files downloaded onto your device? Download my app, [mdtohtml](https://github.com/GoobisMoobis/mdtohtml/releases/tag/v1.0.4/)**`,
          extraKeys: {
            "Tab": function(cm) {
              cm.replaceSelection("    ", "end");
            }
          }
        });

        htmlEditor = CodeMirror(document.getElementById('htmlEditorWrapper'), {
          mode: 'htmlmixed',
          theme: 'dracula',
          lineNumbers: true,
          lineWrapping: false,
          readOnly: true,
          indentUnit: 2,
          tabSize: 2
        });

        markdownEditor.on('change', updatePreview);
      }

      const htmlPreview = document.getElementById("htmlPreview");
      const toggleHtmlBtn = document.getElementById("toggleHtmlBtn");
      const openPreviewBtn = document.getElementById("openPreviewBtn");
      const mobileToggleBtn = document.getElementById("mobileToggleBtn");
      const resizer = document.getElementById("resizer");
      const editorPreviewContainer = document.querySelector(".editor-preview-container");
      const previewContainer = document.querySelector(".preview-container");
      const downloadBtn = document.getElementById("downloadBtn");
      
      marked.setOptions({
        breaks: true,
        gfm: true,
        headerIds: false,
        highlight: function (code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try {
              return hljs.highlight(code, { language: lang }).value;
            } catch (e) {
              console.error(e);
            }
          }
          return hljs.highlightAuto(code).value;
        }
      });
      
      function isMobile() {
        return window.innerWidth <= 768;
      }
      
      function updatePreview() {
        const markdown = markdownEditor.getValue();
        const html = marked.parse(markdown);
        htmlPreview.innerHTML = html;
        
        const fullHtml = `
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
            <!-- These are some basic HTML tags. -->
            <!-- Meta tags aren't required but are standard across websites -->
            <!-- If you are using codeblocks (\`\`\`) you NEED the <link rel="stylesheet"> element -->
            <style>
              body {
                font-family: Arial, sans-serif;
                line-height: 1.6;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
              }
              pre {
                background-color: #f6f8fa;
                border-radius: 3px;
                padding: 16px;
                overflow: auto;
              }
              code {
                font-family: 'Consolas', 'Monaco', monospace;
                padding: 0.2em 0.4em;
                border-radius: 3px;
                background-color: #f6f8fa;
              }
              pre code {
                padding: 0;
                background-color: transparent;
              }
              blockquote {
                border-left: 4px solid #ddd;
                padding-left: 1em;
                margin-left: 0;
                color: #666;
                background-color: #f9f9f9;
                padding: 10px;
                overflow: hidden;
              }
            </style>
          </head>
          <body>
            ${html}
          </body>
          </html>
        `;
        
        const formattedHtml = html_beautify(fullHtml, {
          indent_size: 2,
          wrap_line_length: 80,
          preserve_newlines: true,
          max_preserve_newlines: 2
        });
        
        // Update HTML editor
        htmlEditor.setValue(formattedHtml);
      }
      
      function toggleHtmlView() {
        isHtmlView = !isHtmlView;
        
        if (isHtmlView) {
          // Show HTML editor, hide Markdown editor
          document.getElementById('markdownEditorWrapper').classList.remove('active');
          document.getElementById('htmlEditorWrapper').classList.add('active');
          toggleHtmlBtn.textContent = "Show Markdown";
          
          // Refresh HTML editor to ensure proper rendering
          setTimeout(() => {
            htmlEditor.refresh();
          }, 10);
        } else {
          // Show Markdown editor, hide HTML editor
          document.getElementById('htmlEditorWrapper').classList.remove('active');
          document.getElementById('markdownEditorWrapper').classList.add('active');
          toggleHtmlBtn.textContent = "Show HTML";
          
          // Refresh Markdown editor to ensure proper rendering
          setTimeout(() => {
            markdownEditor.refresh();
          }, 10);
        }
      }
      
      function updateMobileLayout() {
        if (isMobile()) {
          if (isMobilePreviewMode) {
            editorPreviewContainer.style.display = "none";
            previewContainer.style.display = "flex";
            mobileToggleBtn.textContent = "Switch to Editor";
          } else {
            editorPreviewContainer.style.display = "flex";
            previewContainer.style.display = "none";
            mobileToggleBtn.textContent = "Switch to Preview";
          }
        } else {
          editorPreviewContainer.style.display = "flex";
          previewContainer.style.display = "flex";
          isMobilePreviewMode = false;
        }
        
        // Refresh the active editor after layout change
        setTimeout(() => {
          if (isHtmlView) {
            htmlEditor.refresh();
          } else {
            markdownEditor.refresh();
          }
        }, 100);
      }
      
      function handleResize(e) {
        if (!isResizing || isMobile()) return;
        
        const container = document.querySelector(".main-container");
        const containerRect = container.getBoundingClientRect();
        const containerWidth = containerRect.width;
        
        // Calculate new width based on mouse position relative to container
        const newLeftWidth = ((e.clientX - containerRect.left) / containerWidth) * 100;
        
        // Apply constraints
        const minWidth = 20; // 20% minimum
        const maxWidth = 80; // 80% maximum
        
        const constrainedWidth = Math.max(minWidth, Math.min(maxWidth, newLeftWidth));
        
        editorPreviewContainer.style.width = `${constrainedWidth}%`;
        resizer.style.left = `${constrainedWidth}%`;
        
        // Refresh the active editor
        setTimeout(() => {
          if (isHtmlView) {
            htmlEditor.refresh();
          } else {
            markdownEditor.refresh();
          }
        }, 10);
      }
      
      function stopResize() {
        isResizing = false;
        document.body.style.cursor = "";
        document.removeEventListener("mousemove", handleResize);
        document.removeEventListener("mouseup", stopResize);
      }
      
      function startResize(e) {
        isResizing = true;
        document.body.style.cursor = "col-resize";
        document.addEventListener("mousemove", handleResize);
        document.addEventListener("mouseup", stopResize);
        e.preventDefault();
      }
      
      toggleHtmlBtn.addEventListener("click", toggleHtmlView);
      
      openPreviewBtn.addEventListener("click", function () {
        const markdown = markdownEditor.getValue();
        const html = marked.parse(markdown);
        const newTab = window.open("about:blank", "_blank");
        if (newTab) {
          newTab.document.write(`
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Markdown Preview</title>
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
              <style>
                body {
                  font-family: Arial, sans-serif;
                  line-height: 1.6;
                  max-width: 800px;
                  margin: 0 auto;
                  padding: 20px;
                }
                pre {
                  background-color: #f6f8fa;
                  border-radius: 3px;
                  padding: 16px;
                  overflow: auto;
                }
                code {
                  font-family: 'Consolas', 'Monaco', monospace;
                  padding: 0.2em 0.4em;
                  border-radius: 3px;
                  background-color: #f6f8fa;
                }
                pre code {
                  padding: 0;
                  background-color: transparent;
                }
                blockquote {
                  border-left: 4px solid #ddd;
                  padding-left: 1em;
                  margin-left: 0;
                  color: #666;
                  background-color: #f9f9f9;
                  padding: 10px;
                  overflow: hidden;
                }
              </style>
            </head>
            <body>
              ${html}
            </body>
            </html>
          `);
          newTab.document.close();
        }
      });
      
      mobileToggleBtn.addEventListener("click", function () {
        isMobilePreviewMode = !isMobilePreviewMode;
        updateMobileLayout();
      });
      
      resizer.addEventListener("mousedown", startResize);
      
      downloadBtn.addEventListener("click", function () {
        window.open("https://github.com/GoobisMoobis/mdtohtml/releases/tag/v1.0.4", "_blank");
      });
      
      window.addEventListener("resize", function () {
        updateMobileLayout();
      });
      
      // Initialize
      window.addEventListener("load", function () {
        initializeEditors();
        updatePreview();
        isMobilePreviewMode = false;
        updateMobileLayout();
        
        // Set initial resizer position
        const container = document.querySelector(".main-container");
        const containerRect = container.getBoundingClientRect();
        const initialWidth = editorPreviewContainer.getBoundingClientRect().width;
        const percentage = (initialWidth / containerRect.width) * 100;
        resizer.style.left = `${percentage}%`;
      });
    </script>
  </body>
</html>
